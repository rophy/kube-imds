identities:
  # Single IP
  - ips: ["10.0.1.10"]
    serviceAccount:
      name: "vm-worker-1"
      namespace: "external-identities"

  # Multiple IPs mapped to the same ServiceAccount
  - ips:
      - "10.0.1.20"
      - "10.0.1.21"
      - "10.0.1.22"
    serviceAccount:
      name: "vm-pool"
      namespace: "external-identities"

  # CIDR range -- all IPs in this subnet get the same identity
  - ips: ["10.0.2.0/24"]
    serviceAccount:
      name: "vm-subnet"
      namespace: "external-identities"
    tokenSpec:
      audiences: ["custom-audience"]
      expirationSeconds: 7200

defaults:
  tokenSpec:
    audiences: ["api"]
    expirationSeconds: 3600

# When exposed behind an ingress gateway, set this to the HTTP header
# that contains the real client IP. Common values:
#   "X-Forwarded-For"          - standard, works with most gateways
#   "X-Envoy-External-Address" - Istio/Envoy (requires numTrustedProxies)
#   "X-Real-IP"                - NGINX
# WARNING: The header value is trusted blindly. Ensure only trusted sources
# (e.g. your ingress gateway) can reach this service via NetworkPolicies.
# clientIPHeader: "X-Forwarded-For"
