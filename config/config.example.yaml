identities:
  - ip: "10.0.1.10"
    serviceAccount:
      name: "vm-worker-1"
      namespace: "external-identities"

  - ip: "10.0.1.11"
    serviceAccount:
      name: "vm-worker-2"
      namespace: "external-identities"
    tokenSpec:
      audiences: ["custom-audience"]
      expirationSeconds: 7200

defaults:
  tokenSpec:
    audiences: ["api"]
    expirationSeconds: 3600

# When exposed behind an ingress gateway, enable this to read client IP
# from the X-Forwarded-For header instead of RemoteAddr.
# WARNING: This trusts the header blindly. Ensure only trusted sources
# (e.g. your ingress gateway) can reach this service via NetworkPolicies.
# useXForwardedFor: true
