apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-imds
  namespace: kube-imds
  labels:
    app: kube-imds
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-imds
  template:
    metadata:
      labels:
        app: kube-imds
    spec:
      serviceAccountName: kube-imds
      containers:
        - name: kube-imds
          image: rophy/kube-imds
          args:
            - --config=/etc/kube-imds/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              mountPath: /etc/kube-imds
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: kube-imds
