apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-imds
  namespace: kube-imds
data:
  config.yaml: |
    identities:
      - ip: "10.0.1.10"
        serviceAccount:
          name: "vm-worker-1"
          namespace: "kube-imds"

    defaults:
      tokenSpec:
        audiences: ["api"]
        expirationSeconds: 3600
